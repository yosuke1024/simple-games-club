# install → lint → typecheck → test → build, then prove the Dockerfile builds.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm format:check
      - run: pnpm test
      - run: pnpm build

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t simple-games-club:ci .
      # The image answers on /api/v1/health with a fresh, unclaimed database.
      - run: |
          docker run -d --name club -p 8080:8080 simple-games-club:ci
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:8080/api/v1/health | grep -q '"claimed":false'; then
              exit 0
            fi
            sleep 1
          done
          docker logs club
          exit 1
