# Opt-in managed hosting deployment. This does not change club.pixapps.ai.
# Required secrets, both distinct 32+ random characters:
#   wrangler secret put CLUB_MANAGED_SECRET --config wrangler.managed.toml
#   wrangler secret put CLUB_MANAGED_ADMIN_KEY --config wrangler.managed.toml
# Review billing, public origin/CORS, retention and translated consent before enabling clients.
name = "simple-games-managed"
main = "src/worker/index.ts"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

[assets]
directory = "./web"
binding = "ASSETS"
not_found_handling = "none"
run_worker_first = ["/api/*", "/clubs/*", "/", "/index.html", "/join", "/join/"]

[[durable_objects.bindings]]
name = "CLUB"
class_name = "ClubObject"

[[durable_objects.bindings]]
name = "MANAGED_DIRECTORY"
class_name = "ManagedDirectoryObject"

[[durable_objects.bindings]]
name = "MANAGED_CLUB"
class_name = "ManagedClubObject"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["ClubObject", "ManagedDirectoryObject", "ManagedClubObject"]

[vars]
CLUB_MANAGED_ENABLED = "1"
CLUB_HOSTING_PROVIDER = "managed"
CLUB_CORS_ORIGINS = "https://pixapps.ai"

[observability]
enabled = true
