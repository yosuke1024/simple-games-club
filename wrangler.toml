# The Cloudflare deployment (src/worker/index.ts): one Worker on one origin
# carrying the Public Club House (one SQLite-backed Durable Object) and the
# managed Club Houses (`/api/v1/managed`, `/clubs/*`; docs/managed.md), the web
# build as static assets. The same club.md §5 contract as the Node server,
# proven by the same tests (test/impl/workers.ts).
#
# What this file cannot carry is set on the deployment:
#   wrangler secret put CLUB_SETUP_KEY   # claims the club once (README「Claim the club」)
#   wrangler secret put CLUB_SECRET      # optional; generated into the object when absent
#   wrangler secret put CLUB_MANAGED_SECRET     # managed hosting; 32+ random characters
#   wrangler secret put CLUB_MANAGED_ADMIN_KEY  # managed hosting; 32+, distinct from the above
# Put both managed secrets before the first deploy of this file: without them the
# managed routes answer 500 (the Public Club House is unaffected).
# Never CLUB_TEST_MODE (test/units.test.ts checks).
name = "simple-games-club"
main = "src/worker/index.ts"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]

# The deployment's one address: a custom domain on a zone this account holds.
# wrangler creates the DNS record and the certificate on deploy. The
# workers.dev address is off — one origin for invite links and CORS.
routes = [{ pattern = "club.pixapps.ai", custom_domain = true }]
workers_dev = false

# Hashed assets are served here, free and before the Worker runs; only the
# API and the entry pages reach the Worker (and so count as requests).
[assets]
directory = "./web"
binding = "ASSETS"
not_found_handling = "none"
run_worker_first = ["/api/*", "/clubs/*", "/.well-known/*", "/", "/index.html", "/join", "/join/"]

[[durable_objects.bindings]]
name = "CLUB"
class_name = "ClubObject"

# Managed hosting: the directory of owners and clubs, and one object per club.
[[durable_objects.bindings]]
name = "MANAGED_DIRECTORY"
class_name = "ManagedDirectoryObject"

[[durable_objects.bindings]]
name = "MANAGED_CLUB"
class_name = "ManagedClubObject"

# SQLite storage is the only backend the Free plan allows, and the type is
# fixed at creation (docs/cloudflare.md).
[[migrations]]
tag = "v1"
new_sqlite_classes = ["ClubObject"]

# Added when managed hosting joined this deployment. v1 is already applied to
# club.pixapps.ai and is never edited; new classes get a new tag.
[[migrations]]
tag = "v2"
new_sqlite_classes = ["ManagedDirectoryObject", "ManagedClubObject"]

[vars]
# The Durable Object this deployment talks to (idFromName). A new name is a new, empty
# club: the object that holds the measurement data stays where it is, unreferenced
# (simple-games docs/architecture/club.md §14 判断 17, §17-4). Claim it with
# scripts/claim-public.mjs.
CLUB_OBJECT_NAME = "club-2026-10"
# This file is the Public deployment's configuration: anyone may join without an invite.
CLUB_OPEN_JOIN = "1"
# Anyone may join, so the member cap is the abuse ceiling, not a club size
# (simple-games docs/architecture/club.md §14-26). The other limits stay at src/limits.ts.
CLUB_LIMITS = '{"maxMembers": 10000}'
# The Public Club House's label. Managed clubs report "managed" on their own
# (src/managed/tenant.ts), so the two never share this value.
CLUB_HOSTING_PROVIDER = "cloudflare"
# Managed Club Houses on this same origin: invites are
# https://club.pixapps.ai/join#club=…, endpoints https://club.pixapps.ai/clubs/<id>.
CLUB_MANAGED_ENABLED = "1"
# The app that opens invite links when it is installed (src/http/appLinks.ts).
# Android: the upload key (directly installed APKs) and Play's app-signing key.
CLUB_ANDROID_PACKAGE = "com.pixapps.simplegames"
CLUB_ANDROID_CERT_SHA256 = "BF:0B:5A:52:D6:42:4E:74:5E:7A:76:10:45:D9:72:65:61:C5:C9:B3:5D:02:E3:F4:1E:AA:84:4D:09:7E:0A:7F,B8:D4:B9:44:09:76:F2:93:85:95:3F:B3:AF:5F:6F:58:99:C3:AC:03:62:4F:F5:64:5F:45:57:E6:96:76:08:C6"
CLUB_IOS_APP_IDS = "8XR3LLAS54.com.pixapps.simplegames"
# Invite links name this origin whichever hostname the request arrived on.
CLUB_PUBLIC_ORIGIN = "https://club.pixapps.ai"
# The Web version at pixapps.ai joins the Public Club House from its own origin
# (simple-games docs/architecture/club.md §15-1); the app's two origins are always allowed.
CLUB_CORS_ORIGINS = "https://pixapps.ai"

# Workers Logs: the request count is visible in the dashboard either way; this
# keeps the object's console.error (a 500) readable. Free plan: 200,000 events
# a day, 3 days of retention (docs/cloudflare.md).
[observability]
enabled = true
